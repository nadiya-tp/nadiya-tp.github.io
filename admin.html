// ============ PROGRESS ============
function renderProgress() {
  const days = 14;
  const today = new Date(); today.setHours(23,59,59,999);
  const startDate = new Date(); startDate.setDate(startDate.getDate() - (days - 1)); startDate.setHours(0,0,0,0);

  // Daily activity counts
  const dailyCells = Array(days).fill(0);
  const dailySubs = Array(days).fill(0);
  const dailyStudents = Array.from({ length: days }, () => new Set());

  cells.forEach(c => {
    const d = new Date(c.updated_at || c.created_at);
    if (d < startDate || d > today) return;
    const idx = Math.floor((d - startDate) / (24 * 3600 * 1000));
    if (idx >= 0 && idx < days) { dailyCells[idx]++; if (c.author_name) dailyStudents[idx].add(c.author_name); }
  });
  submissions.forEach(s => {
    const d = new Date(s.submitted_at);
    if (d < startDate || d > today) return;
    const idx = Math.floor((d - startDate) / (24 * 3600 * 1000));
    if (idx >= 0 && idx < days) { dailySubs[idx]++; if (s.author_name) dailyStudents[idx].add(s.author_name); }
  });

  const totalActivity = dailyCells.map((v, i) => v + dailySubs[i]);
  const maxActivity = Math.max(1, ...totalActivity);

  const dayLabels = Array.from({ length: days }, (_, i) => {
    const d = new Date(startDate); d.setDate(d.getDate() + i);
    return d.toLocaleDateString('fa-IR', { day: 'numeric', month: 'numeric' });
  });

  const chartHtml = `<div class="bar-chart">${totalActivity.map((v, i) => `<div class="bar" style="height:${(v / maxActivity) * 100}%" title="${v} فعالیت"><div class="bar-label">${dayLabels[i]}</div></div>`).join('')}</div>`;

  // Per-student progress
  const studentProgress = Object.values(studentsByName).map(s => {
    const myCells = cells.filter(c => c.author_name === s.name);
    const mySubs = submissions.filter(x => x.author_name === s.name);
    const last7 = new Date(); last7.setDate(last7.getDate() - 7);
    const prev7 = new Date(); prev7.setDate(prev7.getDate() - 14);

    const thisWeekCells = myCells.filter(c => new Date(c.created_at) >= last7).length;
    const thisWeekSubs = mySubs.filter(s => new Date(s.submitted_at) >= last7);
    const lastWeekCells = myCells.filter(c => { const d = new Date(c.created_at); return d >= prev7 && d < last7; }).length;
    const lastWeekSubs = mySubs.filter(s => { const d = new Date(s.submitted_at); return d >= prev7 && d < last7; });

    const thisWeekSolved = thisWeekSubs.filter(x => x.status === 'correct').length;
    const lastWeekSolved = lastWeekSubs.filter(x => x.status === 'correct').length;

    const thisWeekTotal = thisWeekCells + thisWeekSolved;
    const lastWeekTotal = lastWeekCells + lastWeekSolved;
    const delta = thisWeekTotal - lastWeekTotal;

    const trendClass = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
    const trendSymbol = delta > 0 ? '▲' : delta < 0 ? '▼' : '▬';

    // Sparkline (last 14 days activity)
    const spark = Array(14).fill(0);
    myCells.forEach(c => {
      const d = new Date(c.created_at);
      const idx = Math.floor((d - startDate) / (24 * 3600 * 1000));
      if (idx >= 0 && idx < 14) spark[idx]++;
    });
    mySubs.forEach(s => {
      const d = new Date(s.submitted_at);
      const idx = Math.floor((d - startDate) / (24 * 3600 * 1000));
      if (idx >= 0 && idx < 14) spark[idx]++;
    });
    const maxSpark = Math.max(1, ...spark);
    const sparkHtml = spark.map(v => `<div class="sp" style="height:${(v/maxSpark)*100}%"></div>`).join('');

    const solvedCount = mySubs.filter(x => x.status === 'correct').length;
    const totalExForStudent = [...s.sessionRefs].reduce((sum, sid) => sum + (exercisesByClass[sid] || []).length, 0);

    return { name: s.name, thisWeekTotal, lastWeekTotal, delta, trendClass, trendSymbol, sparkHtml, cells: myCells.length, solved: solvedCount, totalEx: totalExForStudent, lastActive: s.lastActive };
  }).filter(p => {
    if (filterSessionId) {
      const s = studentsByName[p.name];
      return s && s.sessionRefs.has(filterSessionId);
    }
    return true;
  }).sort((a, b) => b.delta - a.delta);

  // Active vs at-risk
  const active = studentProgress.filter(p => p.thisWeekTotal >= 3).length;
  const atRisk = studentProgress.filter(p => p.thisWeekTotal === 0).length;
  const improving = studentProgress.filter(p => p.delta > 0).length;
  const declining = studentProgress.filter(p => p.delta < 0).length;

  const summaryHtml = `
    <div class="stats-grid" style="margin-bottom:20px">
      <div class="stat-card good"><span class="icon">📈</span><h3>پیشرفت</h3><div class="value">${improving}</div><div class="sub">در حال رشد</div></div>
      <div class="stat-card bad"><span class="icon">📉</span><h3>پسرفت</h3><div class="value">${declining}</div><div class="sub">کاهش فعالیت</div></div>
      <div class="stat-card"><span class="icon">🔥</span><h3>فعال</h3><div class="value">${active}</div><div class="sub">۳+ فعالیت اخیر</div></div>
      <div class="stat-card warn"><span class="icon">⚠️</span><h3>بی‌فعالیت</h3><div class="value">${atRisk}</div><div class="sub">هیچ فعالیتی این هفته</div></div>
    </div>
  `;

  const chartSection = `
    <div class="section">
      <h2>📊 فعالیت ${days} روز اخیر</h2>
      ${chartHtml}
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:20px">
        مجموع ${totalActivity.reduce((a,b) => a+b, 0)} فعالیت · پیک در روز ${dayLabels[totalActivity.indexOf(maxActivity)]}
      </div>
    </div>
  `;

  const studentTable = studentProgress.length ? studentProgress.map(p => {
    const color = colorOf(p.name);
    return `<div class="team-item" data-student="${escapeHtml(p.name)}" style="border-right-color:${color}">
      <div class="team-info">
        <div class="team-color" style="background:${color}">${escapeHtml(initials(p.name))}</div>
        <div style="min-width:0;flex:1">
          <div class="team-name">${escapeHtml(p.name)} <span class="progress-trend ${p.trendClass}">${p.trendSymbol} ${Math.abs(p.delta)}</span></div>
          <div class="team-meta">سلول: ${p.cells} · تمرین حل‌شده: ${p.solved}/${p.totalEx} · آخرین: ${fmtRelative(p.lastActive)}</div>
        </div>
        <div class="sparkline" style="margin-right:12px">${p.sparkHtml}</div>
      </div>
      <div class="team-stats">
        <div class="team-stat"><div class="num">${p.thisWeekTotal}</div><div class="label">این هفته</div></div>
        <div class="team-stat"><div class="num" style="color:${p.delta > 0 ? 'var(--success)' : p.delta < 0 ? 'var(--danger)' : 'var(--muted)'}">${p.delta > 0 ? '+' : ''}${p.delta}</div><div class="label">تغییر</div></div>
      </div>
    </div>`;
  }).join('') : '<div class="empty"><span class="emoji">🎓</span>دانشجویی نیست</div>';

  return summaryHtml + chartSection + `<div class="section"><h2>🎓 پیشرفت هر دانشجو <span class="count">${studentProgress.length}</span></h2><div class="team-list">${studentTable}</div></div>`;
}

// ============ ACTIVITY ============
function renderActivity() {
  const recentCells = cells.filter(c => !filterSessionId || c.class_id === filterSessionId).map(c => ({
    type: 'cell', id: c.id, author: c.author_name, team: c.team_name, class: sessions.find(x => x.id === c.class_id),
    when: c.updated_at || c.created_at, hasCode: c.code && c.code.trim(),
    hasErr: c.output && (c.output.includes('Error') || c.output.includes('Pyodide')), codeLen: (c.code || '').length
  }));
  const recentSubs = submissions.filter(s => {
    if (!filterSessionId) return true;
    const ex = exercises.find(e => e.id === s.exercise_id);
    return ex && ex.class_id === filterSessionId;
  }).map(s => {
    const ex = exercises.find(e => e.id === s.exercise_id);
    return { type: 'submission', id: s.id, author: s.author_name, class: ex ? sessions.find(x => x.id === ex.class_id) : null, exTitle: ex?.title || '—', status: s.status, score: s.score || 0, passed: s.passed_tests || 0, total: s.total_tests || 0, when: s.submitted_at };
  });
  const all = [...recentCells, ...recentSubs].sort((a, b) => new Date(b.when) - new Date(a.when)).slice(0, 40);
  if (!all.length) return `<div class="section"><div class="empty"><span class="emoji">📡</span>فعالیتی نیست</div></div>`;
  const rows = all.map(it => {
    if (it.type === 'cell') {
      const dotColor = it.hasErr ? 'var(--danger)' : (it.hasCode ? 'var(--success)' : 'var(--muted)');
      return `<div class="activity-item" data-cell-id="${it.id}">
        <span class="activity-dot" style="background:${dotColor}"></span>
        <div style="flex:1;min-width:0">
          <div><span class="activity-author">${escapeHtml(it.author || 'ناشناس')}</span>${it.team ? ` در تیم <b>${escapeHtml(it.team)}</b>` : ' (شخصی)'}${it.class ? ` — ${escapeHtml(it.class.title)}` : ''}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">${it.hasCode ? `${it.codeLen} کاراکتر` : 'بدون کد'}${it.hasErr ? ' • خطا' : ''}</div>
        </div>
        <div class="activity-time">${fmtRelative(it.when)}</div>
      </div>`;
    } else {
      const dotColor = it.status === 'correct' ? 'var(--success)' : it.status === 'partial' ? 'var(--warning)' : 'var(--danger)';
      return `<div class="activity-item" data-ex-sub="${it.id}">
        <span class="activity-dot" style="background:${dotColor}"></span>
        <div style="flex:1;min-width:0">
          <div><span class="activity-author">${escapeHtml(it.author || 'ناشناس')}</span> تمرین <b>${escapeHtml(it.exTitle)}</b> رو ${it.status === 'correct' ? 'کامل حل کرد' : it.status === 'partial' ? 'ناقص حل کرد' : 'اشتباه حل کرد'}${it.class ? ` — ${escapeHtml(it.class.title)}` : ''}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">${it.passed}/${it.total} تست · امتیاز ${it.score}</div>
        </div>
        <div class="activity-time">${fmtRelative(it.when)}</div>
      </div>`;
    }
  }).join('');
  return `<div class="section"><h2>📡 آخرین فعالیت‌ها <span class="count">${all.length}</span></h2>${rows}</div>`;
}

// ============ HANDLERS ============
function bindContentHandlers() {
  document.querySelectorAll('[data-copy-code]').forEach(el => { el.onclick = e => { e.stopPropagation(); const code = el.getAttribute('data-copy-code'); navigator.clipboard.writeText(code).then(() => toast('کد کپی شد: ' + code, 'ok', 2000)); }; });
  document.querySelectorAll('.class-card').forEach(el => { el.onclick = () => openClassDetail(el.getAttribute('data-class-id')); });
  document.querySelectorAll('[data-exercise-id]').forEach(el => { el.onclick = () => openExerciseDetail(el.getAttribute('data-exercise-id')); });
  document.querySelectorAll('[data-shared-id]').forEach(el => { el.onclick = () => openSharedDetail(el.getAttribute('data-shared-id')); });
  document.querySelectorAll('[data-team-id]').forEach(el => { el.onclick = () => openTeamDetail(el.getAttribute('data-team-id')); });
  document.querySelectorAll('[data-student]').forEach(el => { el.onclick = () => openStudentDetail(el.getAttribute('data-student')); });
  document.querySelectorAll('[data-cell-id]').forEach(el => { el.onclick = () => openCellDetail(el.getAttribute('data-cell-id')); });
}

function openModal(title, bodyHtml) { document.getElementById('modalTitle').textContent = title; document.getElementById('modalBody').innerHTML = bodyHtml; document.getElementById('detailModal').classList.add('show'); }
function closeModal() { document.getElementById('detailModal').classList.remove('show'); }
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ============ CLASS DETAIL ============
function openClassDetail(sessionId) {
  const s = sessions.find(x => x.id === sessionId); if (!s) return;
  const sTeams = teamsBySession[s.id] || [], sCells = cellsBySession[s.id] || [];
  const sMembers = membersBySession[s.id] ? [...membersBySession[s.id]] : [];
  const sEx = exercisesByClass[s.id] || [];
  const link = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}?s=${s.code}`;

  const teamsHtml = sTeams.length ? sTeams.map(t => {
    const color = t.color || colorOf(t.name);
    const memberList = membersByTeam[t.id] || [];
    const tCells = cellsByTeam[t.id] || [];
    const coderNames = new Set(tCells.map(c => c.author_name).filter(Boolean));
    const membersChips = memberList.length ? memberList.map(m => { const c = colorOf(m.display_name); const ic = coderNames.has(m.display_name); return `<span class="member-chip ${ic ? '' : 'inactive'}"><span class="dot" style="background:${c}">${escapeHtml(initials(m.display_name))}</span>${escapeHtml(m.display_name)}</span>`; }).join('') : '<span style="font-size:11px;color:var(--muted)">بدون عضو</span>';
    return `<div style="padding:14px 0;border-bottom:1px dashed var(--line)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${color}"></span><b>${escapeHtml(t.name)}</b><span style="font-size:11px;color:var(--muted);margin-right:auto">${memberList.length} عضو · ${tCells.length} سلول</span></div>
      <div class="member-chips">${membersChips}</div>
    </div>`;
  }).join('') : '<div class="empty" style="padding:20px">تیمی نیست</div>';

  const exercisesHtml = sEx.length ? sEx.map(ex => {
    const subs = submissionsByExercise[ex.id] || [];
    const correct = subs.filter(x => x.status === 'correct').length;
    const tests = (ex.test_cases || []).length;
    return `<div class="info-row" data-ex-open="${ex.id}" style="cursor:pointer"><span class="key"><b style="color:var(--ink)">📝 ${escapeHtml(ex.title)}</b></span><span class="val" style="font-size:12px">${correct} حل کامل · ${tests} تست</span></div>`;
  }).join('') : '<div class="empty" style="padding:16px">تمرینی نیست</div>';

  const membersHtml = sMembers.length ? `<div class="member-chips">${sMembers.map(m => { const c = colorOf(m); return `<span class="member-chip"><span class="dot" style="background:${c}">${escapeHtml(initials(m))}</span>${escapeHtml(m)}</span>`; }).join('')}</div>` : '<div class="empty" style="padding:20px">کسی عضو نشده</div>';

  const teamIds = new Set(sTeams.map(t => t.id));
  const sMemberships = teamMembers.filter(m => teamIds.has(m.team_id)).length;

  const body = `
    <div class="info-row"><span class="key">کد کلاس</span><span class="val" style="font-family:monospace;letter-spacing:2px;color:var(--primary)">${escapeHtml(s.code)}</span></div>
    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(s.created_at)}</span></div>
    <div class="info-row"><span class="key">تیم‌ها</span><span class="val">${sTeams.length}</span></div>
    <div class="info-row"><span class="key">اعضای تیم‌ها</span><span class="val">${sMemberships} عضویت (${sMembers.length} نفر یکتا)</span></div>
    <div class="info-row"><span class="key">سلول‌ها</span><span class="val">${sCells.length}</span></div>
    <div class="info-row"><span class="key">تمرین‌ها</span><span class="val">${sEx.length}</span></div>

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🔗 لینک اشتراک</h3>
      <div style="display:flex;gap:8px"><input class="search-input" value="${escapeHtml(link)}" readonly style="font-family:monospace;font-size:11px;direction:ltr"><button class="btn btn-primary" id="copyLinkBtn">📋 کپی</button></div>
    </div>

    <div style="margin-top:24px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📝 تمرین‌های این کلاس</h3>${exercisesHtml}</div>

    <div style="margin-top:24px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧑‍🤝‍🧑 تیم‌ها</h3>${teamsHtml}</div>

    <div style="margin-top:24px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">👥 دانشجوها</h3>${membersHtml}</div>

    <div style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="filterThisClassBtn">🎯 فیلتر این کلاس</button>
      <button class="btn" id="exportClassBtn">💾 خروجی JSON</button>
    </div>
  `;
  openModal('📚 ' + (s.title || 'بدون نام'), body);

  setTimeout(() => {
    document.getElementById('copyLinkBtn')?.addEventListener('click', () => navigator.clipboard.writeText(link).then(() => toast('کپی شد', 'ok')));
    document.getElementById('filterThisClassBtn')?.addEventListener('click', () => { setFilterSession(s.id); closeModal(); toast('فیلتر اعمال شد', 'info'); });
    document.getElementById('exportClassBtn')?.addEventListener('click', () => exportClassJSON(s.id));
    document.querySelectorAll('[data-ex-open]').forEach(el => { el.onclick = () => { closeModal(); setTimeout(() => openExerciseDetail(el.getAttribute('data-ex-open')), 100); }; });
  }, 0);
}

// ============ EXERCISE DETAIL ============
function openExerciseDetail(exerciseId) {
  const ex = exercises.find(e => e.id === exerciseId); if (!ex) return;
  const cls = sessions.find(s => s.id === ex.class_id);
  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];
  const subs = submissionsByExercise[ex.id] || [];
  const correct = subs.filter(s => s.status === 'correct').length;
  const partial = subs.filter(s => s.status === 'partial').length;
  const wrong = subs.filter(s => s.status === 'wrong' || s.status === 'error').length;

  const clsTeams = teams.filter(t => t.class_id === ex.class_id);
  const classTeamIds = new Set(clsTeams.map(t => t.id));
  const classMembers = new Set();
  teamMembers.forEach(m => { if (classTeamIds.has(m.team_id)) classMembers.add(m.display_name); });
  cells.filter(c => c.class_id === ex.class_id && c.author_name).forEach(c => classMembers.add(c.author_name));
  const submittedNames = new Set(subs.map(s => s.author_name));
  const notSubmitted = [...classMembers].filter(n => !submittedNames.has(n));

  const testsHtml = tests.length ? tests.map((tc, i) => `
    <div class="test-result-row" style="background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.3)">
      <div class="test-result-head"><div class="test-result-num"><span class="test-result-status" style="background:var(--primary)">تست ${i+1}</span></div></div>
      <div class="tc-compare">
        <div class="tc-col input"><div class="label">ورودی</div><div class="value">${escapeHtml(tc.input || '(خالی)')}</div></div>
        <div class="tc-col expected"><div class="label">انتظار</div><div class="value">${escapeHtml(tc.expected || '(خالی)')}</div></div>
      </div>
    </div>`).join('') : '<div class="empty" style="padding:16px">تست‌کیسی نیست</div>';

  const subsHtml = subs.length ? subs.map(s => {
    const color = colorOf(s.author_name);
    const passed = s.passed_tests || 0;
    const total = s.total_tests || tests.length || 1;
    return `<div class="submission-row" data-sub-id="${s.id}">
      <div class="submission-avatar" style="background:${color}">${escapeHtml(initials(s.author_name))}</div>
      <div class="submission-info"><div class="submission-name">${escapeHtml(s.author_name)}</div><div class="submission-time">${fmtRelative(s.submitted_at)} · ${passed}/${total} تست</div></div>
      <span class="exercise-status-badge ${s.status}">${statusLabel(s.status)}</span>
    </div>`;
  }).join('') : '<div class="empty" style="padding:16px">کسی پاسخ نداده</div>';

  const notSubHtml = notSubmitted.length ? `<h3 style="font-size:14px;color:var(--muted);margin:20px 0 10px">هنوز پاسخ نداده (${notSubmitted.length})</h3><div class="member-chips">${notSubmitted.map(n => { const c = colorOf(n); return `<span class="member-chip"><span class="dot" style="background:${c}">${escapeHtml(initials(n))}</span>${escapeHtml(n)}</span>`; }).join('')}</div>` : '';

  const body = `
    <div class="info-row"><span class="key">کلاس</span><span class="val">${cls ? escapeHtml(cls.title) + ' (' + escapeHtml(cls.code) + ')' : '—'}</span></div>
    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(ex.created_at)}</span></div>
    <div class="info-row"><span class="key">تعداد تست</span><span class="val">${tests.length}</span></div>
    ${ex.shared_exercise_id ? `<div class="info-row"><span class="key">کتابخانه</span><span class="val" style="color:var(--success)">📖 از کتابخانه اشتراکی</span></div>` : ''}

    ${ex.description ? `<div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📖 توضیحات</h3><div style="background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;white-space:pre-wrap;font-size:13px">${escapeHtml(ex.description)}</div></div>` : ''}

    ${ex.hint ? `<div style="margin-top:16px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💡 راهنمایی</h3><div style="background:rgba(99,102,241,.08);border-right:3px solid var(--primary);border-radius:6px;padding:12px 14px;font-size:13px;line-height:1.7">${escapeHtml(ex.hint)}</div></div>` : ''}

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧪 تست‌کیس‌ها</h3>${testsHtml}</div>

    <div class="ex-stats-row" style="margin-top:20px;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.12))">
      <div class="ex-stat"><div class="num total">${subs.length}</div><div class="label">پاسخ</div></div>
      <div class="ex-stat"><div class="num correct">${correct}</div><div class="label">کامل</div></div>
      <div class="ex-stat"><div class="num partial">${partial}</div><div class="label">ناقص</div></div>
      <div class="ex-stat"><div class="num wrong">${wrong}</div><div class="label">ناموفق</div></div>
    </div>

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">👥 پاسخ‌ها (${subs.length})</h3>${subsHtml}</div>
    ${notSubHtml}
  `;
  openModal('📝 ' + ex.title, body);

  setTimeout(() => {
    document.querySelectorAll('[data-sub-id]').forEach(el => {
      el.onclick = () => {
        const sid = el.getAttribute('data-sub-id'); const sub = subs.find(x => x.id === sid); if (!sub) return;
        openSubmissionDetail(sub, ex);
      };
    });
  }, 0);
}

function openSubmissionDetail(sub, ex) {
  const color = colorOf(sub.author_name);
  const tr = Array.isArray(sub.test_results) ? sub.test_results : [];
  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];
  let resultsHtml = '';
  if (tr.length) {
    resultsHtml = `<h3 style="font-size:14px;color:var(--muted);margin:16px 0 10px">🧪 نتایج تست‌ها</h3>` + tr.map((r, i) => `
      <div class="test-result-row ${r.passed ? 'pass' : 'fail'}">
        <div class="test-result-head">
          <div class="test-result-num"><span class="test-result-status" style="background:${r.passed ? 'var(--success)' : 'var(--danger)'}">تست ${i+1}</span></div>
          <span class="test-result-status">${r.passed ? '✓ پاس' : '✗ ناموفق'}</span>
        </div>
        <div class="tc-compare">
          <div class="tc-col input"><div class="label">ورودی</div><div class="value">${escapeHtml(r.input || '(خالی)')}</div></div>
          <div class="tc-col expected"><div class="label">انتظار</div><div class="value">${escapeHtml(r.expected || '(خالی)')}</div></div>
          <div class="tc-col actual"><div class="label">خروجی</div><div class="value">${escapeHtml(r.actual || '(خالی)')}</div></div>
        </div>
      </div>`).join('');
  } else if (tests.length) resultsHtml = `<div class="empty" style="padding:16px">نتایج ذخیره نشده</div>`;

  const body = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="submission-avatar" style="background:${color};width:56px;height:56px;font-size:20px">${escapeHtml(initials(sub.author_name))}</div>
      <div style="flex:1"><div style="font-size:18px;font-weight:800">${escapeHtml(sub.author_name)}</div><div style="color:var(--muted);font-size:12px;margin-top:2px">${fmtDate(sub.submitted_at)}</div></div>
      <span class="exercise-status-badge ${sub.status}" style="font-size:12px;padding:5px 14px">${statusLabel(sub.status)}</span>
    </div>

    <div class="info-row"><span class="key">امتیاز</span><span class="val">${sub.score || 0} از ۱۰۰</span></div>
    <div class="info-row"><span class="key">تست‌ها</span><span class="val">${sub.passed_tests || 0} از ${sub.total_tests || tests.length || 1}</span></div>

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 کد</h3>
      <div class="code-block">${escapeHtml(sub.code || '(خالی)')}</div>
    </div>

    ${resultsHtml}
  `;
  openModal('👁 ' + sub.author_name, body);
}

// ============ SHARED DETAIL ============
function openSharedDetail(id) {
  const ex = sharedExercises.find(e => e.id === id); if (!ex) return;
  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];
  const usedIn = exercises.filter(e => e.shared_exercise_id === id);

  const testsHtml = tests.length ? tests.map((tc, i) => `
    <div class="test-result-row" style="background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.3)">
      <div class="test-result-head"><div class="test-result-num"><span class="test-result-status" style="background:var(--primary)">تست ${i+1}</span></div></div>
      <div class="tc-compare">
        <div class="tc-col input"><div class="label">ورودی</div><div class="value">${escapeHtml(tc.input || '(خالی)')}</div></div>
        <div class="tc-col expected"><div class="label">انتظار</div><div class="value">${escapeHtml(tc.expected || '(خالی)')}</div></div>
      </div>
    </div>`).join('') : '<div class="empty" style="padding:16px">تستی نیست</div>';

  const usedHtml = usedIn.length ? usedIn.map(e => {
    const cls = sessions.find(s => s.id === e.class_id);
    return `<div class="info-row"><span class="key">📚 ${escapeHtml(cls?.title || '—')}</span><span class="val" style="font-size:11px">${escapeHtml(cls?.code || '—')}</span></div>`;
  }).join('') : '<div class="empty" style="padding:16px">هنوز توی هیچ کلاسی استفاده نشده</div>';

  const body = `
    <div class="info-row"><span class="key">سازنده</span><span class="val">${escapeHtml(ex.created_by_name || 'ناشناس')}</span></div>
    <div class="info-row"><span class="key">تاریخ ساخت</span><span class="val">${fmtDate(ex.created_at)}</span></div>
    <div class="info-row"><span class="key">تعداد تست</span><span class="val">${tests.length}</span></div>
    <div class="info-row"><span class="key">بار استفاده</span><span class="val" style="color:var(--success);font-weight:800">${ex.use_count || 0}</span></div>

    ${ex.description ? `<div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📖 توضیحات</h3><div style="background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;white-space:pre-wrap;font-size:13px">${escapeHtml(ex.description)}</div></div>` : ''}

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧪 تست‌کیس‌ها</h3>${testsHtml}</div>

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📚 استفاده شده در کلاس‌ها (${usedIn.length})</h3>${usedHtml}</div>
  `;
  openModal('📖 ' + ex.title, body);
}

// ============ TEAM DETAIL ============
function openTeamDetail(teamId) {
  const t = teams.find(x => x.id === teamId); if (!t) return;
  const color = t.color || colorOf(t.name);
  const session = sessions.find(s => s.id === t.class_id);
  const memberList = membersByTeam[t.id] || [];
  const tCells = (cellsByTeam[t.id] || []).slice().sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
  const coderNames = new Set(tCells.map(c => c.author_name).filter(Boolean));

  const classEx = exercises.filter(e => e.class_id === t.class_id);
  const memberNames = new Set(memberList.map(m => m.display_name));
  const teamSubs = submissions.filter(s => memberNames.has(s.author_name));

  const exHtml = classEx.length ? classEx.map(ex => {
    const tests = (ex.test_cases || []).length;
    const exSubs = teamSubs.filter(s => s.exercise_id === ex.id);
    const correctM = new Set(exSubs.filter(s => s.status === 'correct').map(s => s.author_name));
    const partialM = new Set(exSubs.filter(s => s.status === 'partial').map(s => s.author_name));
    return `<div class="info-row"><span class="key"><b style="color:var(--ink)">📝 ${escapeHtml(ex.title)}</b></span><span class="val" style="font-size:12px"><span class="ex-chip success">✓ ${correctM.size}</span> ${partialM.size ? `<span class="ex-chip warning">◐ ${partialM.size}</span>` : ''} <span style="color:var(--muted);margin-right:6px">از ${memberList.length} · ${tests} تست</span></span></div>`;
  }).join('') : '<div class="empty" style="padding:16px">تمرینی نیست</div>';

  const membersHtml = memberList.length ? `<div class="member-chips">${memberList.map(m => { const c = colorOf(m.display_name); const ic = coderNames.has(m.display_name); const cnt = tCells.filter(x => x.author_name === m.display_name).length; const solved = teamSubs.filter(x => x.author_name === m.display_name && x.status === 'correct').length; return `<span class="member-chip ${ic ? '' : 'inactive'}"><span class="dot" style="background:${c}">${escapeHtml(initials(m.display_name))}</span>${escapeHtml(m.display_name)}${solved > 0 ? ` (${solved} تمرین)` : (ic ? ` (${cnt})` : '')}</span>`; }).join('')}</div>` : '<div class="empty" style="padding:16px">بدون عضو</div>';

  const cellsHtml = tCells.length ? tCells.slice(0, 15).map(c => {
    const hasErr = c.output && (c.output.includes('Error') || c.output.includes('Pyodide'));
    const preview = (c.code || '').slice(0, 60).replace(/\n/g, ' ');
    return `<div class="info-row" data-cell-open="${c.id}" style="cursor:pointer"><span class="key"><b style="color:var(--ink)">${escapeHtml(c.author_name || 'ناشناس')}</b><span style="color:var(--muted);font-size:11px"> ${fmtRelative(c.updated_at || c.created_at)}</span></span><span class="val" style="color:${hasErr ? 'var(--danger)' : 'var(--muted)'};font-family:monospace;font-size:11px;direction:ltr;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(preview || '(خالی)')}</span></div>`;
  }).join('') : '<div class="empty" style="padding:16px">سلولی نیست</div>';

  const body = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="team-color" style="background:${color};width:56px;height:56px;font-size:20px">${escapeHtml(initials(t.name))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:20px;font-weight:800">${escapeHtml(t.name)}</div>
        <div style="color:var(--muted);font-size:13px;margin-top:2px">${session ? `📚 ${escapeHtml(session.title)} (${escapeHtml(session.code)})` : 'بدون کلاس'}</div>
      </div>
    </div>

    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(t.created_at)}</span></div>
    <div class="info-row"><span class="key">اعضا</span><span class="val">${memberList.length}</span></div>
    <div class="info-row"><span class="key">کدنویس‌ها</span><span class="val">${coderNames.size} از ${memberList.length}</span></div>
    <div class="info-row"><span class="key">سلول‌ها</span><span class="val">${tCells.length}</span></div>

    <div style="margin-top:24px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📝 پیشرفت تمرین‌ها</h3>${exHtml}</div>
    <div style="margin-top:24px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">👥 اعضا</h3>${membersHtml}</div>
    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 سلول‌ها (${tCells.length > 15 ? `۱۵ از ${tCells.length}` : tCells.length})</h3>${cellsHtml}</div>

    ${session ? `<div style="margin-top:24px"><button class="btn btn-primary" id="filterFromTeamBtn">🎯 فیلتر روی کلاس</button></div>` : ''}
  `;
  openModal('🧑‍🤝‍🧑 ' + t.name, body);

  setTimeout(() => {
    document.querySelectorAll('[data-cell-open]').forEach(el => { el.onclick = () => openCellDetail(el.getAttribute('data-cell-open')); });
    document.getElementById('filterFromTeamBtn')?.addEventListener('click', () => { if (!session) return; setFilterSession(session.id); closeModal(); toast('فیلتر اعمال شد', 'info'); });
  }, 0);
}

// ============ STUDENT DETAIL ============
function openStudentDetail(name) {
  const s = studentsByName[name]; if (!s) return;
  const color = colorOf(name);
  const myCells = cells.filter(c => c.author_name === name).sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
  const myMemberships = teamMembers.filter(m => m.display_name === name);
  const mySubs = submissions.filter(x => x.author_name === name);

  const teamsByClassForStudent = {};
  [...s.teamRefs].forEach(tid => { const t = teams.find(x => x.id === tid); if (!t) return; const cid = t.class_id; if (!teamsByClassForStudent[cid]) teamsByClassForStudent[cid] = []; teamsByClassForStudent[cid].push(t); });

  const classBlocksHtml = Object.entries(teamsByClassForStudent).map(([cid, list]) => {
    const cls = sessions.find(x => x.id === cid);
    const teamsHtml = list.map(t => { const tc = t.color || colorOf(t.name); const im = myMemberships.some(m => m.team_id === t.id); return `<span class="team-tag"><span class="tdot" style="background:${tc}"></span><span class="tname">${escapeHtml(t.name)}</span>${im ? '<span style="color:var(--success);font-size:10px">✓</span>' : ''}</span>`; }).join('');
    return `<div style="margin-bottom:14px;padding:12px 14px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="code-chip" style="font-family:monospace;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--primary);background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);padding:3px 10px;border-radius:999px">${escapeHtml(cls?.code || '—')}</span><span style="font-weight:700">${escapeHtml(cls?.title || 'بدون نام')}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${teamsHtml}</div>
    </div>`;
  }).join('') || '<div class="empty" style="padding:16px">تیمی ندارد</div>';

  const studentClassIds = new Set([...s.sessionRefs]);
  const relevantEx = exercises.filter(e => studentClassIds.has(e.class_id));
  const exProgressHtml = relevantEx.length ? relevantEx.map(ex => {
    const sub = mySubs.find(x => x.exercise_id === ex.id);
    const status = sub ? sub.status : 'pending';
    const passed = sub ? (sub.passed_tests || 0) : 0;
    const total = sub ? (sub.total_tests || 0) : ((ex.test_cases || []).length || 1);
    const cls = sessions.find(x => x.id === ex.class_id);
    const badge = `<span class="exercise-status-badge ${status}">${statusLabel(status)}${status === 'partial' ? ` ${passed}/${total}` : ''}</span>`;
    return `<div class="info-row" data-ex-open="${ex.id}" style="cursor:pointer"><span class="key"><b style="color:var(--ink)">📝 ${escapeHtml(ex.title)}</b><span style="color:var(--muted);font-size:11px"> ${escapeHtml(cls?.title || '—')}</span></span><span class="val">${badge}</span></div>`;
  }).join('') : '<div class="empty" style="padding:16px">تمرینی نیست</div>';

  const cellsHtml = myCells.slice(0, 15).map(c => {
    const hasErr = c.output && (c.output.includes('Error') || c.output.includes('Pyodide'));
    const preview = (c.code || '').slice(0, 60).replace(/\n/g, ' ');
    const cls = sessions.find(x => x.id === c.class_id);
    return `<div class="info-row" data-cell-open="${c.id}" style="cursor:pointer"><span class="key" style="color:var(--muted);font-size:11px">${escapeHtml(cls?.title || '—')} · ${fmtRelative(c.updated_at || c.created_at)}</span><span class="val" style="color:${hasErr ? 'var(--danger)' : 'var(--muted)'};font-family:monospace;font-size:11px;direction:ltr;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(preview || '(خالی)')}</span></div>`;
  }).join('');

  const memberBadge = s.isMember
    ? `<span style="font-size:11px;background:rgba(16,185,129,.15);color:var(--success);padding:3px 10px;border-radius:999px;font-weight:700;border:1px solid rgba(16,185,129,.3)">✓ عضو تیم</span>`
    : `<span style="font-size:11px;background:rgba(148,163,184,.15);color:var(--muted);padding:3px 10px;border-radius:999px;font-weight:700;border:1px solid var(--line)">بدون عضویت</span>`;

  const solvedExCount = mySubs.filter(x => x.status === 'correct').length;

  const body = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="team-color" style="background:${color};width:56px;height:56px;font-size:20px">${escapeHtml(initials(name))}</div>
      <div><div style="font-size:20px;font-weight:800">${escapeHtml(name)}</div><div style="margin-top:4px">${memberBadge}</div></div>
    </div>

    <div class="info-row"><span class="key">سلول‌ها</span><span class="val">${s.cells}</span></div>
    <div class="info-row"><span class="key">تمرین‌های حل‌شده</span><span class="val">${solvedExCount}</span></div>
    <div class="info-row"><span class="key">نظرات</span><span class="val">${s.comments}</span></div>
    <div class="info-row"><span class="key">عضویت‌ها</span><span class="val">${myMemberships.length}</span></div>
    <div class="info-row"><span class="key">آخرین فعالیت</span><span class="val">${fmtRelative(s.lastActive)}</span></div>

    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📝 پیشرفت تمرین‌ها</h3>${exProgressHtml}</div>
    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">🧑‍🤝‍🧑 تیم‌ها</h3>${classBlocksHtml}</div>
    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 کدها (${myCells.length > 15 ? `۱۵ از ${myCells.length}` : myCells.length})</h3>${cellsHtml || '<div class="empty" style="padding:16px">کدی نیست</div>'}</div>
  `;
  openModal('🎓 ' + name, body);

  setTimeout(() => {
    document.querySelectorAll('[data-cell-open]').forEach(el => { el.onclick = () => openCellDetail(el.getAttribute('data-cell-open')); });
    document.querySelectorAll('[data-ex-open]').forEach(el => { el.onclick = () => { closeModal(); setTimeout(() => openExerciseDetail(el.getAttribute('data-ex-open')), 100); }; });
  }, 0);
}

// ============ CELL DETAIL ============
function openCellDetail(cellId) {
  const c = cells.find(x => x.id === cellId); if (!c) return;
  const session = sessions.find(s => s.id === c.class_id);
  const team = teams.find(t => t.id === c.team_id);
  const hasErr = c.output && (c.output.includes('Error') || c.output.includes('Pyodide'));
  const body = `
    <div class="info-row"><span class="key">نویسنده</span><span class="val">${escapeHtml(c.author_name || 'ناشناس')}</span></div>
    <div class="info-row"><span class="key">تیم</span><span class="val">${team ? escapeHtml(team.name) : '📝 شخصی'}</span></div>
    <div class="info-row"><span class="key">کلاس</span><span class="val">${session ? escapeHtml(session.title) + ' (' + escapeHtml(session.code) + ')' : '—'}</span></div>
    <div class="info-row"><span class="key">ایجاد</span><span class="val">${fmtDate(c.created_at)}</span></div>
    <div class="info-row"><span class="key">آخرین ویرایش</span><span class="val">${fmtDate(c.updated_at || c.created_at)}</span></div>
    <div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">💻 کد</h3><div class="code-block">${escapeHtml(c.code || '(خالی)')}</div></div>
    ${c.output ? `<div style="margin-top:20px"><h3 style="font-size:14px;color:var(--muted);margin-bottom:10px">📤 خروجی</h3><div class="code-block ${hasErr ? 'err' : ''}">${escapeHtml(c.output)}</div></div>` : ''}
  `;
  openModal('💻 سلول ' + c.id.slice(0, 8), body);
}

// ============ EXPORT ============
function exportClassJSON(sessionId) {
  const s = sessions.find(x => x.id === sessionId); if (!s) return;
  const sTeams = teams.filter(t => t.class_id === sessionId);
  const teamIds = new Set(sTeams.map(t => t.id));
  const sEx = exercises.filter(e => e.class_id === sessionId);
  const exIds = new Set(sEx.map(e => e.id));
  const data = {
    session: s, teams: sTeams,
    team_members: teamMembers.filter(m => teamIds.has(m.team_id)),
    cells: cells.filter(c => c.class_id === sessionId),
    exercises: sEx,
    exercise_submissions: submissions.filter(s => exIds.has(s.exercise_id)),
    exported_at: new Date().toISOString()
  };
  downloadJSON(data, `class-${s.code}-${new Date().toISOString().slice(0,10)}.json`);
  toast('خروجی گرفته شد', 'ok');
}
function exportAllJSON() {
  const data = {
    exported_at: new Date().toISOString(),
    stats: { sessions: sessions.length, teams: teams.length, team_members: teamMembers.length, cells: cells.length, comments: comments.length, exercises: exercises.length, exercise_submissions: submissions.length, shared_exercises: sharedExercises.length, students: Object.keys(studentsByName).length },
    sessions, teams, team_members: teamMembers, cells, comments, exercises, exercise_submissions: submissions, shared_exercises: sharedExercises
  };
  downloadJSON(data, `admin-backup-${new Date().toISOString().slice(0,10)}.json`);
  toast('بکاپ کامل دانلود شد', 'ok');
}
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
}

// ============ INIT ============
if (sessionStorage.getItem('adminAuth') === 'true') showDashboard();
</script>

</body>
</html>
