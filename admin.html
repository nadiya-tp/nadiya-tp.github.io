<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت - کلاس پایتون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root {
  --bg: #0b1020; --bg-2: #0f172a; --card: #1e293b; --card-2: #253347;
  --ink: #f1f5f9; --muted: #94a3b8; --line: #334155;
  --primary: #6366f1; --primary-2: #8b5cf6;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #06b6d4;
  --radius: 14px; --radius-sm: 10px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: radial-gradient(1200px 600px at 100% -10%, rgba(139,92,246,.10), transparent 60%), radial-gradient(900px 500px at -10% 0%, rgba(99,102,241,.10), transparent 55%), var(--bg); color: var(--ink); font-family: 'Vazirmatn', sans-serif; min-height: 100vh; line-height: 1.6; }

.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: fixed; inset: 0; background: linear-gradient(135deg, #0b1020, #1e293b); z-index: 9999; }
.login-screen.hidden { display: none; }
.login-box { background: var(--card); padding: 44px 36px; border-radius: 20px; box-shadow: var(--shadow); max-width: 420px; width: 100%; border: 1px solid var(--line); }
.login-box h1 { font-size: 26px; margin-bottom: 8px; text-align: center; }
.login-box p { color: var(--muted); text-align: center; margin-bottom: 26px; font-size: 14px; }
.login-box input { width: 100%; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 16px; font-family: inherit; margin-bottom: 16px; text-align: center; font-weight: 600; }
.login-box input:focus { outline: none; border-color: var(--primary); }
.login-box button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,.4); }
.error-msg { color: var(--danger); text-align: center; margin-top: 12px; font-size: 13px; min-height: 20px; }

.dashboard { display: none; max-width: 1400px; margin: 0 auto; padding: 28px 24px 80px; }
.dashboard.show { display: block; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 16px; }
.header h1 { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.header-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { padding: 10px 16px; border-radius: var(--radius-sm); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: all .2s; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { transform: translateY(-1px); border-color: var(--primary); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-color: transparent; color: #fff; }
.btn-primary:hover { box-shadow: 0 8px 20px rgba(99,102,241,.35); }
.btn-danger { color: var(--danger); border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.08); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 11px; font-size: 12px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: linear-gradient(135deg, var(--card), var(--card-2)); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); position: relative; overflow: hidden; transition: all .25s; }
.stat-card:hover { transform: translateY(-3px); border-color: var(--primary); }
.stat-card .icon { position: absolute; top: 14px; left: 16px; font-size: 22px; opacity: .35; }
.stat-card h3 { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.stat-card .value { font-size: 34px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.1; }
.stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.stat-card.good .value { background: linear-gradient(135deg, #10b981, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stat-card.warn .value { background: linear-gradient(135deg, #f59e0b, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stat-card.bad .value { background: linear-gradient(135deg, #ef4444, #b91c1c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.tabs { display: flex; gap: 6px; margin-bottom: 20px; padding: 6px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow-x: auto; flex-wrap: wrap; }
.tab { padding: 10px 18px; border: none; background: transparent; border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); background: rgba(99,102,241,.08); }
.tab.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,.3); }

.search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 200px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); color: var(--ink); font-family: inherit; font-size: 14px; }
.search-input:focus { outline: none; border-color: var(--primary); }

.section { background: var(--card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 20px; }
.section h2 { font-size: 18px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
.section h2 .count { font-size: 12px; background: var(--primary); color: #fff; padding: 2px 10px; border-radius: 999px; font-weight: 700; }

.class-group { margin-bottom: 28px; }
.class-group:last-child { margin-bottom: 0; }
.class-group-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.class-group-head .code-chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--primary); background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); padding: 3px 10px; border-radius: 999px; }
.class-group-head .name { font-weight: 700; font-size: 15px; }
.class-group-head .count-badge { font-size: 11px; color: var(--muted); margin-right: auto; }

.class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.class-card { background: linear-gradient(180deg, var(--bg-2), var(--card)); padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); transition: all .25s; cursor: pointer; position: relative; overflow: hidden; }
.class-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--primary-2), #ec4899); }
.class-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.class-card h3 { font-size: 17px; margin-bottom: 10px; font-weight: 700; }
.class-code { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; margin-bottom: 12px; cursor: pointer; }
.class-code:hover { transform: scale(1.05); }
.class-meta { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.class-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.class-stat { text-align: center; }
.class-stat .num { font-size: 18px; font-weight: 800; color: var(--primary); }
.class-stat .label { font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 2px; }

.team-list { display: flex; flex-direction: column; gap: 10px; }
.team-item { background: var(--bg-2); padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); border-right: 4px solid; display: flex; justify-content: space-between; align-items: center; gap: 14px; transition: all .2s; cursor: pointer; flex-wrap: wrap; }
.team-item:hover { background: var(--card-2); transform: translateX(-3px); }
.team-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.team-color { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.team-name { font-size: 15px; font-weight: 700; }
.team-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.team-stats { display: flex; gap: 14px; }
.team-stat { text-align: center; min-width: 44px; }
.team-stat .num { font-size: 17px; font-weight: 800; color: var(--primary); }
.team-stat .label { font-size: 10px; color: var(--muted); font-weight: 600; }

.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.ex-card { background: linear-gradient(180deg, var(--bg-2), var(--card)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all .25s; position: relative; overflow: hidden; }
.ex-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
.ex-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.ex-card .desc { font-size: 12px; color: var(--muted); line-height: 1.6; max-height: 52px; overflow: hidden; margin-bottom: 12px; }
.ex-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); padding-top: 10px; border-top: 1px dashed var(--line); margin-bottom: 10px; flex-wrap: wrap; }
.ex-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(99,102,241,.12); color: var(--primary); border: 1px solid rgba(99,102,241,.3); }
.ex-chip.success { background: rgba(16,185,129,.12); color: var(--success); border-color: rgba(16,185,129,.3); }
.ex-chip.warning { background: rgba(245,158,11,.12); color: var(--warning); border-color: rgba(245,158,11,.3); }
.ex-chip.danger { background: rgba(239,68,68,.12); color: var(--danger); border-color: rgba(239,68,68,.3); }
.ex-chip.lib { background: rgba(139,92,246,.15); color: #a78bfa; border-color: rgba(139,92,246,.4); }

.ex-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; padding: 12px; background: rgba(0,0,0,.2); border-radius: var(--radius-sm); }
.ex-stat { text-align: center; }
.ex-stat .num { font-size: 18px; font-weight: 800; line-height: 1.2; }
.ex-stat .num.total { color: var(--primary); }
.ex-stat .num.correct { color: var(--success); }
.ex-stat .num.partial { color: var(--warning); }
.ex-stat .num.wrong { color: var(--danger); }
.ex-stat .label { font-size: 10px; color: var(--muted); font-weight: 700; margin-top: 2px; }

.ex-progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; display: flex; margin-bottom: 4px; }
.ex-progress .bar-correct { background: var(--success); }
.ex-progress .bar-partial { background: var(--warning); }
.ex-progress .bar-wrong { background: var(--danger); }
.ex-progress .bar-pending { background: var(--line); }

.lb-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; transition: all .2s; }
.lb-row:hover { transform: translateX(-3px); border-color: var(--primary); }
.lb-rank { font-size: 22px; font-weight: 800; min-width: 44px; text-align: center; color: var(--muted); }
.lb-rank.gold { color: #fbbf24; }
.lb-rank.silver { color: #cbd5e1; }
.lb-rank.bronze { color: #d97706; }
.lb-body { flex: 1; min-width: 0; }
.lb-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.lb-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.lb-bar { height: 6px; background: var(--line); border-radius: 999px; margin-top: 8px; overflow: hidden; max-width: 300px; }
.lb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-2)); border-radius: 999px; transition: width .5s; }
.lb-score { font-size: 22px; font-weight: 800; color: var(--success); min-width: 60px; text-align: center; }

.activity-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 13px; }
.activity-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
.activity-time { color: var(--muted); font-size: 11px; margin-right: auto; }
.activity-author { font-weight: 700; }

.member-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.member-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); color: #a5b4fc; border-radius: 999px; font-size: 11px; font-weight: 600; }
.member-chip .dot { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 800; }
.member-chip.inactive { background: rgba(148,163,184,.10); border-color: var(--line); color: var(--muted); }
.member-chip.inactive .dot { opacity: .5; }

.team-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(148,163,184,.12); border: 1px solid var(--line); border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--ink); }
.team-tag .tdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.team-tag .tname { font-weight: 700; }
.team-tag .tclass { color: var(--muted); font-size: 10px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 9000; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 20px; border: 1px solid var(--line); max-width: 800px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); position: relative; }
.modal-wide { max-width: 1000px; }
.modal-head { padding: 24px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card); z-index: 2; border-radius: 20px 20px 0 0; }
.modal-head h2 { font-size: 20px; }
.modal-close { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(148,163,184,.15); color: var(--muted); font-size: 18px; cursor: pointer; }
.modal-close:hover { background: var(--danger); color: #fff; }
.modal-body { padding: 24px 28px; }

.code-block { background: #0b1020; color: #d1fae5; padding: 14px 16px; border-radius: var(--radius-sm); font-family: 'JetBrains Mono', monospace; font-size: 12px; direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); }
.code-block.err { color: #fca5a5; }

.info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13px; gap: 12px; flex-wrap: wrap; }
.info-row:last-child { border-bottom: none; }
.info-row .key { color: var(--muted); }
.info-row .val { font-weight: 600; }

.test-result-row { background: #0f172a; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.test-result-row.pass { border-color: rgba(16,185,129,.45); }
.test-result-row.fail { border-color: rgba(239,68,68,.45); }
.test-result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.test-result-num { font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.test-result-row.pass .test-result-num { color: var(--success); }
.test-result-row.fail .test-result-num { color: var(--danger); }
.test-result-status { font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.test-result-row.pass .test-result-status { background: var(--success); color: #fff; }
.test-result-row.fail .test-result-status { background: var(--danger); color: #fff; }
.tc-compare { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
@media (max-width: 700px) { .tc-compare { grid-template-columns: 1fr; } }
.tc-col { background: rgba(0,0,0,.25); border-radius: 6px; padding: 8px 10px; }
.tc-col .label { font-weight: 800; color: var(--muted); font-size: 10px; text-transform: uppercase; margin-bottom: 4px; }
.tc-col .value { font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; direction: ltr; text-align: left; max-height: 100px; overflow-y: auto; }
.tc-col.input .value { color: #c4b5fd; }
.tc-col.expected .value { color: #a7f3d0; }
.tc-col.actual .value { color: #fca5a5; }
.test-result-row.pass .tc-col.actual .value { color: #a7f3d0; }

.loader { text-align: center; padding: 60px 20px; color: var(--muted); }
.spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 15px; }
@keyframes spin { to { transform: rotate(360deg); } }

.toasts { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 99999; }
.toast { background: var(--card); border: 1px solid var(--line); color: var(--ink); padding: 12px 18px; border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 13px; display: flex; align-items: center; gap: 10px; min-width: 220px; }
.toast.ok { border-color: var(--success); background: linear-gradient(135deg, rgba(16,185,129,.15), var(--card)); }
.toast.err { border-color: var(--danger); background: linear-gradient(135deg, rgba(239,68,68,.15), var(--card)); }
.toast.info { border-color: var(--primary); background: linear-gradient(135deg, rgba(99,102,241,.15), var(--card)); }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.empty .emoji { font-size: 42px; margin-bottom: 10px; display: block; opacity: .6; }

.auto-refresh { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,.25); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(16,185,129,.25); } 50% { box-shadow: 0 0 0 6px rgba(16,185,129,.1); } }

.active-filter { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.35); color: #a5b4fc; border-radius: 999px; font-size: 12px; font-weight: 600; }
.active-filter button { background: transparent; border: none; color: inherit; cursor: pointer; font-size: 14px; }
.active-filter button:hover { color: var(--danger); }

/* Progress specific */
.progress-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.progress-trend.up { color: #10b981; background: rgba(16,185,129,.12); }
.progress-trend.down { color: #ef4444; background: rgba(239,68,68,.12); }
.progress-trend.flat { color: #94a3b8; background: rgba(148,163,184,.12); }

.bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 100px; padding: 10px 0; }
.bar-chart .bar { flex: 1; background: linear-gradient(180deg, var(--primary), var(--primary-2)); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; transition: all .3s; }
.bar-chart .bar:hover { filter: brightness(1.3); }
.bar-chart .bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--muted); white-space: nowrap; }

.sparkline { display: inline-flex; align-items: flex-end; gap: 2px; height: 24px; }
.sparkline .sp { width: 4px; background: var(--primary); border-radius: 1px; min-height: 2px; }

.timeline { position: relative; padding-right: 24px; }
.timeline::before { content: ''; position: absolute; right: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.timeline-item { position: relative; padding: 10px 0; }
.timeline-item::before { content: ''; position: absolute; right: -20px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card); }

@media (max-width: 640px) {
  .dashboard { padding: 16px 12px 60px; }
  .header h1 { font-size: 20px; }
  .stat-card .value { font-size: 26px; }
  .class-stats { grid-template-columns: repeat(2, 1fr); }
  .modal-body, .modal-head { padding: 18px; }
  .team-item { padding: 12px; }
  .ex-stats-row { grid-template-columns: repeat(2, 1fr); }
  .ex-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 پنل مدیریت</h1>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://fqwlbqpduxmpnlvxrmsy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxd2xicXBkdXhtcG5sdnhybXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MTUwNjEsImV4cCI6MjEwNTM5MTA2MX0.5qvPUi_grBuUgITLpG0-QShzLsLaiA07i7pWRtnsWPc';
const ADMIN_PASSWORD = 'admin2025';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const PALETTE = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f59e0b','#10b981','#06b6d4','#3b82f6','#84cc16','#eab308'];

function colorOf(name) { let h = 0; const s = name || '؟'; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }
function initials(name) { const s = (name || '؟').trim(); const p = s.split(/\s+/); if (p.length === 1) return p[0].slice(0,1).toUpperCase(); return (p[0][0] + p[1][0]).toUpperCase(); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function fmtDate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('fa-IR'); } catch { return iso; } }
function fmtRelative(iso) {
  if (!iso) return '—';
  const d = Date.now() - new Date(iso).getTime(); const s = Math.floor(d/1000);
  if (s < 60) return 'همین حالا';
  const m = Math.floor(s/60); if (m < 60) return `${m} دقیقه پیش`;
  const h = Math.floor(m/60); if (h < 24) return `${h} ساعت پیش`;
  const dd = Math.floor(h/24); if (dd < 30) return `${dd} روز پیش`;
  return fmtDate(iso);
}
function toast(msg, type = 'info', ms = 3000) {
  const icons = { ok: '✓', err: '✕', info: 'ℹ' };
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = `<b>${icons[type] || ''}</b><span>${escapeHtml(msg)}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function statusLabel(s) { return s === 'correct' ? '✓ کامل' : s === 'partial' ? '◐ ناقص' : s === 'wrong' ? '✗ نادرست' : s === 'error' ? '⚠ خطا' : '○ نامشخص'; }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); d.setHours(0,0,0,0); return d; }

// ============ STATE ============
let sessions = [], teams = [], teamMembers = [], cells = [], comments = [], exercises = [], submissions = [], sharedExercises = [];
let activeTab = 'classes', searchQuery = '', filterSessionId = '', autoRefreshInterval = null;

let membersByTeam = {}, membersBySession = {}, cellsByTeam = {}, cellsBySession = {}, teamsBySession = {}, commentsByCell = {};
let studentsByName = {}, codersByName = {}, exercisesByClass = {}, submissionsByExercise = {}, submissionsByStudent = {};

// ============ LOGIN ============
function doLogin() {
  const pw = document.getElementById('passwordInput').value;
  if (pw === ADMIN_PASSWORD) { sessionStorage.setItem('adminAuth', 'true'); showDashboard(); }
  else document.getElementById('errorMsg').textContent = 'رمز عبور اشتباه است';
}
function showDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('show');
  loadData();
}
function doLogout() {
  sessionStorage.removeItem('adminAuth');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('dashboard').classList.remove('show');
  document.getElementById('passwordInput').value = '';
  document.getElementById('errorMsg').textContent = '';
  if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
}
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('passwordInput').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('refreshBtn').onclick = loadData;
document.getElementById('exportAllBtn').onclick = exportAllJSON;
document.getElementById('autoRefreshToggle').onchange = (e) => {
  if (e.target.checked) { autoRefreshInterval = setInterval(loadData, 30000); toast('به‌روزرسانی خودکار فعال شد', 'info'); }
  else { if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; } toast('خاموش شد', 'info'); }
};
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab'); if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active'); activeTab = tab.getAttribute('data-tab'); render();
});
document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('filterSession').addEventListener('change', e => { filterSessionId = e.target.value; renderActiveFilterChip(); render(); });
function setFilterSession(id) { filterSessionId = id || ''; document.getElementById('filterSession').value = filterSessionId; renderActiveFilterChip(); render(); }
function renderActiveFilterChip() {
  const wrap = document.getElementById('activeFilterChip');
  if (!filterSessionId) { wrap.innerHTML = ''; return; }
  const s = sessions.find(x => x.id === filterSessionId); if (!s) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<span class="active-filter">📚 ${escapeHtml(s.title || 'بدون نام')} (${escapeHtml(s.code)}) <button id="clearFilterBtn">✕</button></span>`;
  document.getElementById('clearFilterBtn').onclick = () => setFilterSession('');
}

// ============ LOAD ============
async function loadData() {
  const tsEl = document.getElementById('timestamp'); tsEl.textContent = 'در حال بارگذاری…';
  try {
    const [sR, tR, mR, cR, cmR, eR, sR2, shR] = await Promise.all([
      supabase.from('class_sessions').select('*').order('created_at', { ascending: false }),
      supabase.from('teams').select('*').order('created_at', { ascending: true }),
      supabase.from('team_members').select('*').order('joined_at', { ascending: true }),
      supabase.from('cells').select('*').order('created_at', { ascending: false }),
      supabase.from('comments').select('*').order('created_at', { ascending: false }),
      supabase.from('exercises').select('*').order('created_at', { ascending: false }),
      supabase.from('exercise_submissions').select('*').order('submitted_at', { ascending: false }),
      supabase.from('shared_exercises').select('*').order('created_at', { ascending: false })
    ]);
    if (sR.error) throw new Error('کلاس‌ها: ' + sR.error.message);
    if (tR.error) throw new Error('تیم‌ها: ' + tR.error.message);
    if (mR.error) throw new Error('اعضا: ' + mR.error.message);
    if (cR.error) throw new Error('سلول‌ها: ' + cR.error.message);
    if (cmR.error) throw new Error('نظرات: ' + cmR.error.message);
    if (eR.error) throw new Error('تمرین‌ها: ' + eR.error.message);
    if (sR2.error) throw new Error('پاسخ‌ها: ' + sR2.error.message);
    if (shR.error) console.warn('کتابخانه:', shR.error);

    sessions = sR.data || [];
    teams = tR.data || [];
    teamMembers = mR.data || [];
    cells = cR.data || [];
    comments = cmR.data || [];
    exercises = eR.data || [];
    submissions = sR2.data || [];
    sharedExercises = shR.data || [];

    computeDerived(); populateFilter(); updateStats(); render(); renderActiveFilterChip();
    tsEl.innerHTML = `<span class="pulse-dot"></span> آخرین به‌روزرسانی: ${new Date().toLocaleTimeString('fa-IR')}`;
  } catch (err) {
    console.error(err); tsEl.textContent = 'خطا: ' + err.message;
    toast('خطا: ' + err.message, 'err', 6000);
  }
}

function computeDerived() {
  membersByTeam = {}; membersBySession = {}; cellsByTeam = {}; cellsBySession = {}; teamsBySession = {};
  commentsByCell = {}; studentsByName = {}; codersByName = {}; exercisesByClass = {}; submissionsByExercise = {}; submissionsByStudent = {};

  teams.forEach(t => { if (!teamsBySession[t.class_id]) teamsBySession[t.class_id] = []; teamsBySession[t.class_id].push(t); });

  teamMembers.forEach(m => {
    if (!membersByTeam[m.team_id]) membersByTeam[m.team_id] = [];
    membersByTeam[m.team_id].push(m);
    const team = teams.find(t => t.id === m.team_id);
    if (team && team.class_id) {
      if (!membersBySession[team.class_id]) membersBySession[team.class_id] = new Set();
      membersBySession[team.class_id].add(m.display_name);
    }
    if (m.display_name) {
      if (!studentsByName[m.display_name]) studentsByName[m.display_name] = { name: m.display_name, cells: 0, comments: 0, teamRefs: new Set(), sessionRefs: new Set(), lastActive: m.joined_at, isMember: true };
      const s = studentsByName[m.display_name];
      s.isMember = true;
      if (m.team_id) s.teamRefs.add(m.team_id);
      if (team && team.class_id) s.sessionRefs.add(team.class_id);
      if (m.joined_at && (!s.lastActive || new Date(m.joined_at) > new Date(s.lastActive))) s.lastActive = m.joined_at;
    }
  });

  cells.forEach(c => {
    if (c.team_id) { if (!cellsByTeam[c.team_id]) cellsByTeam[c.team_id] = []; cellsByTeam[c.team_id].push(c); }
    if (c.class_id) { if (!cellsBySession[c.class_id]) cellsBySession[c.class_id] = []; cellsBySession[c.class_id].push(c); }
    if (c.author_name) {
      if (!studentsByName[c.author_name]) studentsByName[c.author_name] = { name: c.author_name, cells: 0, comments: 0, teamRefs: new Set(), sessionRefs: new Set(), lastActive: c.updated_at || c.created_at, isMember: false };
      const s = studentsByName[c.author_name]; s.cells++;
      if (c.team_id) s.teamRefs.add(c.team_id);
      if (c.class_id) s.sessionRefs.add(c.class_id);
      const d = c.updated_at || c.created_at;
      if (d && (!s.lastActive || new Date(d) > new Date(s.lastActive))) s.lastActive = d;
      if (!codersByName[c.author_name]) codersByName[c.author_name] = { name: c.author_name, cells: 0, lastActive: d };
      codersByName[c.author_name].cells++;
      if (d && new Date(d) > new Date(codersByName[c.author_name].lastActive)) codersByName[c.author_name].lastActive = d;
    }
  });

  comments.forEach(cm => {
    if (!commentsByCell[cm.cell_id]) commentsByCell[cm.cell_id] = [];
    commentsByCell[cm.cell_id].push(cm);
    if (cm.author_name && studentsByName[cm.author_name]) studentsByName[cm.author_name].comments++;
  });

  exercises.forEach(ex => { if (!exercisesByClass[ex.class_id]) exercisesByClass[ex.class_id] = []; exercisesByClass[ex.class_id].push(ex); });

  submissions.forEach(s => {
    if (!submissionsByExercise[s.exercise_id]) submissionsByExercise[s.exercise_id] = [];
    submissionsByExercise[s.exercise_id].push(s);
    if (!submissionsByStudent[s.author_name]) submissionsByStudent[s.author_name] = [];
    submissionsByStudent[s.author_name].push(s);
    if (s.author_name) {
      if (!studentsByName[s.author_name]) studentsByName[s.author_name] = { name: s.author_name, cells: 0, comments: 0, teamRefs: new Set(), sessionRefs: new Set(), lastActive: s.submitted_at, isMember: false };
      const st = studentsByName[s.author_name];
      if (s.submitted_at && (!st.lastActive || new Date(s.submitted_at) > new Date(st.lastActive))) st.lastActive = s.submitted_at;
    }
  });
}

function populateFilter() {
  const sel = document.getElementById('filterSession'); const cur = sel.value;
  sel.innerHTML = '<option value="">همه کلاس‌ها</option>' + sessions.map(s => `<option value="${s.id}">${escapeHtml(s.title || 'بدون نام')} (${s.code})</option>`).join('');
  sel.value = cur;
  if (cur && !sessions.find(s => s.id === cur)) sel.value = '';
}

// ============ STATS ============
function updateStats() {
  const totalStudents = Object.keys(studentsByName).length;
  const last24 = Date.now() - 24 * 3600 * 1000;

  document.getElementById('statSessions').textContent = sessions.length;
  document.getElementById('statTeams').textContent = teams.length;
  document.getElementById('statStudents').textContent = totalStudents;
  document.getElementById('statCells').textContent = cells.length;
  document.getElementById('statExercises').textContent = exercises.length;
  document.getElementById('statSubmissions').textContent = submissions.filter(s => s.status === 'correct').length;
  document.getElementById('statShared').textContent = sharedExercises.length;

  const activeSet = new Set();
  cells.forEach(c => { const d = c.updated_at || c.created_at; if (d && new Date(d).getTime() > last24 && c.author_name) activeSet.add(c.author_name); });
  submissions.forEach(s => { if (s.submitted_at && new Date(s.submitted_at).getTime() > last24 && s.author_name) activeSet.add(s.author_name); });
  document.getElementById('statActive').textContent = activeSet.size;

  const totalTests = exercises.reduce((sum, e) => sum + ((e.test_cases || []).length || 0), 0);
  const totalPassed = submissions.reduce((sum, s) => sum + (s.passed_tests || 0), 0);
  const totalUsed = sharedExercises.reduce((sum, e) => sum + (e.use_count || 0), 0);

  document.getElementById('subSessions').textContent = `${teams.length} تیم · ${totalStudents} دانشجو`;
  document.getElementById('subTeams').textContent = `میانگین ${teams.length ? (teamMembers.length / teams.length).toFixed(1) : 0} در هر تیم`;
  document.getElementById('subStudents').textContent = `${Object.keys(codersByName).length} نفر کد زدن`;
  const withCode = cells.filter(c => c.code && c.code.trim()).length;
  document.getElementById('subCells').textContent = `${withCode} تا دارای کد`;
  document.getElementById('subExercises').textContent = `${totalTests} تست‌کیس در کل`;
  document.getElementById('subSubmissions').textContent = `از ${submissions.length} پاسخ (${totalPassed} تست پاس)`;
  document.getElementById('subShared').textContent = `${totalUsed} بار استفاده شده`;
  document.getElementById('subActive').textContent = `از ${totalStudents} دانشجو`;
}

// ============ RENDER ============
function render() {
  const c = document.getElementById('content');
  if (activeTab === 'classes') c.innerHTML = renderClasses();
  else if (activeTab === 'exercises') c.innerHTML = renderExercises();
  else if (activeTab === 'library') c.innerHTML = renderLibrary();
  else if (activeTab === 'teams') c.innerHTML = renderTeams();
  else if (activeTab === 'leaderboard') c.innerHTML = renderLeaderboard();
  else if (activeTab === 'students') c.innerHTML = renderStudents();
  else if (activeTab === 'progress') c.innerHTML = renderProgress();
  else if (activeTab === 'activity') c.innerHTML = renderActivity();
  bindContentHandlers();
}

function matchesSearch(...strs) { if (!searchQuery) return true; return strs.filter(Boolean).join(' ').toLowerCase().includes(searchQuery); }

// ============ CLASSES ============
function renderClasses() {
  const filtered = sessions.filter(s => { if (filterSessionId && s.id !== filterSessionId) return false; return matchesSearch(s.title, s.code); });
  if (!filtered.length) return `<div class="section"><div class="empty"><span class="emoji">📚</span>${sessions.length ? 'چیزی پیدا نشد' : 'هنوز کلاسی نیست'}</div></div>`;
  const cards = filtered.map(s => {
    const sTeams = teamsBySession[s.id] || [], sCells = cellsBySession[s.id] || [];
    const sMembers = membersBySession[s.id] ? membersBySession[s.id].size : 0;
    const sEx = exercisesByClass[s.id] || [];
    const teamIds = new Set(sTeams.map(t => t.id));
    const sMemberships = teamMembers.filter(m => teamIds.has(m.team_id)).length;
    return `<div class="class-card" data-class-id="${s.id}">
      <h3>${escapeHtml(s.title || 'بدون نام')}</h3>
      <div class="class-code" data-copy-code="${escapeHtml(s.code)}">📋 ${escapeHtml(s.code)}</div>
      <div class="class-meta">ایجاد: ${fmtDate(s.created_at)}</div>
      <div class="class-stats">
        <div class="class-stat"><div class="num">${sTeams.length}</div><div class="label">تیم</div></div>
        <div class="class-stat"><div class="num">${sMembers}</div><div class="label">دانشجو</div></div>
        <div class="class-stat"><div class="num">${sCells.length}</div><div class="label">سلول</div></div>
        <div class="class-stat"><div class="num">${sEx.length}</div><div class="label">تمرین</div></div>
        <div class="class-stat"><div class="num">${sMemberships}</div><div class="label">عضویت</div></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="section"><h2>📚 کلاس‌ها <span class="count">${filtered.length}</span></h2><div class="class-grid">${cards}</div></div>`;
}

// ============ EXERCISES ============
function renderExercises() {
  const filtered = exercises.filter(ex => {
    if (filterSessionId && ex.class_id !== filterSessionId) return false;
    const cls = sessions.find(x => x.id === ex.class_id);
    return matchesSearch(ex.title, ex.description, cls?.title, cls?.code);
  });
  if (!filtered.length) return `<div class="section"><div class="empty"><span class="emoji">📝</span>${exercises.length ? 'چیزی پیدا نشد' : 'هنوز تمرینی نیست'}</div></div>`;
  const byClass = {};
  filtered.forEach(ex => { if (!byClass[ex.class_id]) byClass[ex.class_id] = []; byClass[ex.class_id].push(ex); });
  const blocks = Object.entries(byClass).map(([cid, list]) => {
    const s = sessions.find(x => x.id === cid);
    const cards = list.map(ex => renderExerciseCard(ex)).join('');
    return `<div class="class-group">
      <div class="class-group-head">
        <span class="code-chip">${escapeHtml(s?.code || '—')}</span>
        <span class="name">${escapeHtml(s?.title || 'بدون نام')}</span>
        <span class="count-badge">${list.length} تمرین</span>
      </div>
      <div class="ex-grid">${cards}</div>
    </div>`;
  }).join('');
  return `<div class="section"><h2>📝 تمرین‌ها <span class="count">${filtered.length}</span></h2>${blocks}</div>`;
}

function renderExerciseCard(ex) {
  const tests = Array.isArray(ex.test_cases) ? ex.test_cases : [];
  const totalTests = tests.length || 1;
  const subs = submissionsByExercise[ex.id] || [];

  const clsTeams = teams.filter(t => t.class_id === ex.class_id);
  const classTeamIds = new Set(clsTeams.map(t => t.id));
  const classMembers = new Set();
  teamMembers.forEach(m => { if (classTeamIds.has(m.team_id)) classMembers.add(m.display_name); });
  cells.filter(c => c.class_id === ex.class_id && c.author_name).forEach(c => classMembers.add(c.author_name));

  const correct = subs.filter(s => s.status === 'correct').length;
  const partial = subs.filter(s => s.status === 'partial').length;
  const wrong = subs.filter(s => s.status === 'wrong' || s.status === 'error').length;
  const notSubmitted = [...classMembers].filter(n => !subs.some(s => s.author_name === n)).length;
  const totalMembers = classMembers.size;

  const pctCorrect = totalMembers > 0 ? Math.round((correct / totalMembers) * 100) : 0;
  const pctPartial = totalMembers > 0 ? Math.round((partial / totalMembers) * 100) : 0;
  const pctWrong = totalMembers > 0 ? Math.round((wrong / totalMembers) * 100) : 0;
  const pctPending = Math.max(0, 100 - pctCorrect - pctPartial - pctWrong);

  const libBadge = ex.shared_exercise_id ? '<span class="ex-chip lib">📖 در کتابخانه</span>' : '';

  return `<div class="ex-card" data-exercise-id="${ex.id}">
    <h3>📝 ${escapeHtml(ex.title)} ${libBadge}</h3>
    ${ex.description ? `<div class="desc">${escapeHtml(ex.description)}</div>` : ''}
    <div class="ex-meta"><span class="ex-chip">${totalTests} تست‌کیس</span><span>${fmtRelative(ex.created_at)}</span></div>
    <div class="ex-stats-row">
      <div class="ex-stat"><div class="num total">${totalMembers}</div><div class="label">دانشجو</div></div>
      <div class="ex-stat"><div class="num correct">${correct}</div><div class="label">کامل</div></div>
      <div class="ex-stat"><div class="num partial">${partial}</div><div class="label">ناقص</div></div>
      <div class="ex-stat"><div class="num wrong">${wrong}</div><div class="label">ناموفق</div></div>
    </div>
    <div class="ex-progress">
      <div class="bar-correct" style="width:${pctCorrect}%"></div>
      <div class="bar-partial" style="width:${pctPartial}%"></div>
      <div class="bar-wrong" style="width:${pctWrong}%"></div>
      <div class="bar-pending" style="width:${pctPending}%"></div>
    </div>
    <div style="font-size:11px;color:var(--muted);text-align:left">${pctCorrect}% حل کامل · ${notSubmitted} نفر بی‌پاسخ</div>
  </div>`;
}

// ============ TEAMS ============
function renderTeams() {
  const filtered = teams.filter(t => {
    if (filterSessionId && t.class_id !== filterSessionId) return false;
    const s = sessions.find(x => x.id === t.class_id);
    return matchesSearch(t.name, s?.title, s?.code);
  });
  if (!filtered.length) return `<div class="section"><div class="empty"><span class="emoji">🧑‍🤝‍🧑</span>${teams.length ? 'چیزی پیدا نشد' : 'هنوز تیمی نیست'}</div></div>`;
  const byClass = {};
  filtered.forEach(t => { if (!byClass[t.class_id]) byClass[t.class_id] = []; byClass[t.class_id].push(t); });
  const blocks = Object.entries(byClass).map(([cid, tlist]) => {
    const s = sessions.find(x => x.id === cid);
    const rows = tlist.map(t => {
      const color = t.color || colorOf(t.name);
      const tCells = cellsByTeam[t.id] || [];
      const memberList = membersByTeam[t.id] || [];
      const coders = new Set(tCells.map(c => c.author_name).filter(Boolean)).size;
      return `<div class="team-item" data-team-id="${t.id}" style="border-right-color:${color}">
        <div class="team-info">
          <div class="team-color" style="background:${color}">${escapeHtml(initials(t.name))}</div>
          <div><div class="team-name">${escapeHtml(t.name)}</div><div class="team-meta">${memberList.length} عضو · ${coders} کدنویس</div></div>
        </div>
        <div class="team-stats">
          <div class="team-stat"><div class="num">${memberList.length}</div><div class="label">عضو</div></div>
          <div class="team-stat"><div class="num">${tCells.length}</div><div class="label">سلول</div></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="class-group">
      <div class="class-group-head"><span class="code-chip">${escapeHtml(s?.code || '—')}</span><span class="name">${escapeHtml(s?.title || 'بدون نام')}</span><span class="count-badge">${tlist.length} تیم</span></div>
      <div class="team-list">${rows}</div>

  return `<div class="section"><h2>🧑‍🤝‍🧑 تیم‌ها <span class="count">${filtered.length}</span></h2>${blocks}</div>`;
}

// ============ LEADERBOARD ============
function renderLeaderboard() {
  const stats = teams.map(t => {
    const tCells = cellsByTeam[t.id] || [];
    const completed = tCells.filter(c => { const o = (c.output || '').trim(); return o && o !== '(بدون خروجی)' && !o.includes('Error') && !o.includes('Pyodide'); }).length;
    const errors = tCells.filter(c => c.output && (c.output.includes('Error') || c.output.includes('Pyodide'))).length;
    const totalCode = tCells.reduce((sum, c) => sum + (c.code || '').length, 0);
    const memberList = membersByTeam[t.id] || [];
    const memberNames = new Set(memberList.map(m => m.display_name));
    const teamSubs = submissions.filter(s => memberNames.has(s.author_name));
    const exOfClass = exercises.filter(e => e.class_id === t.class_id);
    const exIdsOfClass = new Set(exOfClass.map(e => e.id));
    const solvedEx = new Set();
    let totalPassed = 0, totalTests = 0;
    teamSubs.forEach(s => {
      if (!exIdsOfClass.has(s.exercise_id)) return;
      totalPassed += (s.passed_tests || 0);
      totalTests += (s.total_tests || 0);
      if (s.status === 'correct') solvedEx.add(s.user_id + ':' + s.exercise_id);
    });
    return { team: t, completed, errors, totalCode, members: memberList.length, cellCount: tCells.length, solvedEx: solvedEx.size, totalPassed, totalTests, classEx: exOfClass.length };
  }).filter(s => {
    if (filterSessionId && s.team.class_id !== filterSessionId) return false;
    const session = sessions.find(x => x.id === s.team.class_id);
    return matchesSearch(s.team.name, session?.title);
  }).sort((a, b) => b.solvedEx - a.solvedEx || b.completed - a.completed);

  if (!stats.length) return `<div class="section"><div class="empty"><span class="emoji">🏆</span>تیمی نیست</div></div>`;

  const byClass = {};
  stats.forEach(s => { const cid = s.team.class_id; if (!byClass[cid]) byClass[cid] = []; byClass[cid].push(s); });

  let gRank = 0;
  const blocks = Object.entries(byClass).map(([cid, list]) => {
    const s = sessions.find(x => x.id === cid);
    const hasEx = list.some(x => x.classEx > 0);
    const maxCompleted = Math.max(1, ...list.map(x => x.completed));
    const rows = list.map(st => {
      gRank++; const r = gRank;
      const medal = r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : `#${r}`;
      const rankCls = r === 1 ? 'gold' : r === 2 ? 'silver' : r === 3 ? 'bronze' : '';
      const color = st.team.color || colorOf(st.team.name);
      const pct = Math.round((st.completed / maxCompleted) * 100);
      return `<div class="lb-row" data-team-id="${st.team.id}">
        <div class="lb-rank ${rankCls}">${medal}</div>
        <div class="lb-body">
          <div class="lb-title"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span>${escapeHtml(st.team.name)}</div>
          <div class="lb-sub">${st.members} عضو · ${st.cellCount} سلول${hasEx ? ` · ${st.solvedEx}/${st.classEx} تمرین` : ''}</div>
          <div class="lb-bar"><div class="lb-bar-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="lb-score">${hasEx ? st.solvedEx : st.completed}</div>
      </div>`;
    }).join('');
    return `<div class="class-group">
      <div class="class-group-head"><span class="code-chip">${escapeHtml(s?.code || '—')}</span><span class="name">${escapeHtml(s?.title || 'بدون نام')}</span><span class="count-badge">${list.length} تیم</span></div>
      ${rows}
    </div>`;
  }).join('');

  return `<div class="section"><h2>🏆 جدول امتیازات <span class="count">${stats.length} تیم</span></h2>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">مرتب‌سازی: تعداد تمرین‌های کامل، سپس سلول‌های تکمیل‌شده</div>
    ${blocks}
  </div>`;
}
